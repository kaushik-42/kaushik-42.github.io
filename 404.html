<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0d10" />
  <title>404 — Kaushik Tummalapalli</title>
  <meta name="description" content="Page not found. Head back to kaushik-42.github.io." />
  <link rel="icon" type="image/png" href="img/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0d10;
      --bg-elev: #14171c;
      --border: #262b33;
      --text: #f4f5f7;
      --text-muted: #a8afba;
      --accent: #38bdf8;
      --accent-dim: rgba(56, 189, 248, 0.12);
      --font-sans: 'Inter', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      overflow: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        radial-gradient(at 20% 20%, rgba(56, 189, 248, 0.15), transparent 50%),
        radial-gradient(at 80% 80%, rgba(168, 85, 247, 0.10), transparent 50%);
      pointer-events: none;
      z-index: 0;
    }
    .card {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 520px;
    }
    .code {
      font-family: var(--font-mono);
      font-size: clamp(5rem, 18vw, 9rem);
      font-weight: 700;
      letter-spacing: -0.05em;
      background: linear-gradient(120deg, var(--accent), #a855f7);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      line-height: 1;
      margin-bottom: 16px;
    }
    h1 {
      font-size: clamp(1.5rem, 3vw, 2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }
    p {
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.7;
      margin-bottom: 32px;
    }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 22px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 12px;
      border: 1px solid transparent;
      transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      text-decoration: none;
    }
    .btn-primary { background: var(--text); color: var(--bg); }
    .btn-primary:hover { transform: translateY(-2px); }
    .btn-ghost { color: var(--text); border-color: var(--border); }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
    .btn svg { width: 16px; height: 16px; }
    .tag {
      display: inline-block;
      padding: 5px 11px;
      margin-bottom: 24px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--accent);
      background: var(--accent-dim);
      border: 1px solid var(--accent-dim);
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="tag">// route not found</span>
    <div class="code">404</div>
    <h1>This page got lost in the pipeline.</h1>
    <p>Looks like nothing's here — maybe the URL changed, or maybe an old link is hanging around. Let's get you back to the work.</p>
    <div class="actions">
      <a href="/" class="btn btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>
        Go home
      </a>
      <a href="https://github.com/kaushik-42" target="_blank" rel="noopener" class="btn btn-ghost">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5a11.5 11.5 0 0 0-3.6 22.4c.6.1.8-.3.8-.6v-2.2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.6.1-3.2 0 0 1-.3 3.3 1.2a11.4 11.4 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.6.2 2.9.1 3.2.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A11.5 11.5 0 0 0 12 .5z"/></svg>
        Browse GitHub
      </a>
    </div>
  </div>
</body>
</html>
